name: Build signed xDrip APK (public Release)

# Builds the prod release APK, signs it with your own keystore and publishes it as a PUBLIC GitHub Release.
# Manual only: Actions -> Build signed xDrip APK (public Release) -> Run workflow (choose branch native-dexcom-trend).
# For private builds (Google Drive) use build-apk-drive.yml instead.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    base64 of your .jks file   (PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("xdrip.jks")) | Set-Clipboard)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
# Always sign with the SAME keystore, otherwise Android will refuse to update the installed app.

on:
  workflow_dispatch:   # push trigger removed: use build-apk-drive.yml for automatic builds (this one publishes a public Release)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # needed to publish the APK as a GitHub Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build prod release (unsigned)
        run: ./gradlew :app:assembleProdRelease --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing - see the header of this workflow file"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk
          OUT="xDrip-native-dexcom-trend-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=build-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Publishes the signed APK on the repo's Releases page (plain .apk, downloadable from the phone).
      # The newest build is marked "Latest", so this link always points to it:
      #   https://github.com/<owner>/<repo>/releases/latest
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## xDrip+ with the Dexcom trend arrow (built for Dexcom G7)

          An unofficial build of [xDrip+](https://github.com/NightscoutFoundation/xDrip) made for the **Dexcom G7**.
          It changes one thing: the trend arrow shows what the Dexcom G7 reports, instead of the arrow xDrip+
          calculates itself from the last two readings (which often disagrees with the Dexcom app, for example
          45 degrees up while Dexcom shows flat).

          ### What it does
          - **Dexcom Share follow:** the arrow received from Dexcom Share is shown as it is (Flat, 45 up, Single up, ...).
          - **G7 connected directly to xDrip+:** the trend sent by the sensor is used, with the same thresholds as Dexcom.
          - **G7 through a SmartGuide / GluPro bridge:** the trend reported by the bridge is used.
          - The same arrow is used on the home screen, the widget and the data sent to other apps such as AAPS.
          - Everything else is the unchanged xDrip+ code (alarms, graphs, calibration and so on).

          ### Tested
          Share follow was checked on a phone against the Dexcom app. The direct G7 connection and the bridge
          are implemented but have not yet been confirmed with a live sensor.

          ### Important
          - **Experimental and unofficial. Use at your own risk.** It is not a medical device, it is not reviewed or
            supported by the xDrip+ developers or by Dexcom, and it must not be the only basis for treatment decisions.
          - It uses the same app id as the official xDrip+ but a different signature, so it cannot be installed over the
            official app (and the other way round) without uninstalling it first. Export your settings and data before that.
          - Bugs of this build are not the xDrip+ team's responsibility: please report them in this repository only.

          Built from branch \`${GITHUB_REF_NAME}\`, commit ${GITHUB_SHA}. Source is in this repository (GPLv3, same as xDrip+).
          EOF
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --target "$GITHUB_SHA" \
            --title "xDrip+ with Dexcom trend arrow (G7) $(date +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30
